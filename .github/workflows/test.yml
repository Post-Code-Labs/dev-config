name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version from package.json "packageManager".
      - uses: Post-Code-Labs/ci-actions/setup-pnpm@cc8c722a6fb3adca173c5f506eec0bb3abefa4bc # 2026.06.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Install pinned Python tools
        run: |
          mapfile -t python_tools < <(node -e "const versions = require('./versions.json').python_dev; for (const [name, version] of Object.entries(versions)) console.log(name + '==' + version)")
          python -m pip install "${python_tools[@]}"
      - run: pnpm test:python
